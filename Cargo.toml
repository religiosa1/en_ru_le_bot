[package]
name = "en_ru_le_bot"
version = "1.0.0"
license = "MIT"
description = "En/Ru language exchange telegram bot"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
lingua = { version = "1.8.0", default-features = false, features = [
    # ponytail: only latin and cyrillic script languages, others are caught by the charset check before ML
    "afrikaans",
    "albanian",
    "azerbaijani",
    "basque",
    "belarusian",
    "bokmal",
    "bosnian",
    "bulgarian",
    "catalan",
    "croatian",
    "czech",
    "danish",
    "dutch",
    "english",
    "esperanto",
    "estonian",
    "finnish",
    "french",
    "ganda",
    "german",
    "hungarian",
    "icelandic",
    "indonesian",
    "irish",
    "italian",
    "kazakh",
    "latin",
    "latvian",
    "lithuanian",
    "macedonian",
    "malay",
    "maori",
    "mongolian",
    "nynorsk",
    "polish",
    "portuguese",
    "romanian",
    "russian",
    "serbian",
    "shona",
    "slovak",
    "slovene",
    "somali",
    "sotho",
    "spanish",
    "swahili",
    "swedish",
    "tagalog",
    "tsonga",
    "tswana",
    "turkish",
    "ukrainian",
    "vietnamese",
    "welsh",
    "xhosa",
    "yoruba",
    "zulu",
] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
teloxide = { version = "0.17.0", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
